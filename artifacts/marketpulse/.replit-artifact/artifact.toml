kind = "web"
previewPath = "/"
title = "MarketPulse"
description = "A polished digital marketing campaign management and analytics workspace for planning campaigns, monitoring performance, understanding audiences, and turning marketing data into clear next steps."
version = "1.0.0"
id = "artifacts/marketpulse"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19460

[services.development]
run = "pnpm --filter @workspace/marketpulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marketpulse", "run", "build" ]
serve = "static"
publicDir = "artifacts/marketpulse/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19460"
BASE_PATH = "/"
